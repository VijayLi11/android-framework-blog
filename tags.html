<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签 | Android Framework Blog</title>
    <meta name="description" content="按标签浏览 Android 技术文章">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="matrix-bg" id="matrixBg"></div>
    
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">&lt;/&gt;</span>
            <span class="brand-text">Framework<span class="highlight">.dev</span></span>
        </div>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="tags.html" class="active">标签</a>
            <a href="about.html">关于</a>
            <button class="theme-toggle" id="themeToggle" title="切换主题">
                <span class="theme-icon">🌙</span>
            </button>
        </div>
        <button class="menu-toggle" id="menuToggle">☰</button>
    </nav>

    <main class="container">
        <section class="tags-page">
            <h1 class="page-title">
                <span class="page-icon">🏷️</span>
                标签云
            </h1>
            <div class="tags-all" id="tagsAll"></div>
        </section>

        <section class="tag-posts" id="tagPostsSection" style="display:none;">
            <h2 class="section-title">
                <span class="tag-indicator" id="activeTag"></span>
                下的文章
            </h2>
            <div class="posts-grid" id="tagPostsList"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>Built with pure HTML/CSS/JS · Deploy on GitHub Pages</p>
        </div>
    </footer>

    <script src="js/posts.js"></script>
    <script src="js/main.js"></script>
    <script src="js/tags.js"></script>
</body>
</html>
